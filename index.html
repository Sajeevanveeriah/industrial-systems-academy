<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f6ee" />
    <meta
      name="description"
      content="A practical learning workspace for industrial IT, controls, robotics and enterprise integration."
    />
    <title>Signal Works | Industrial Systems Academy</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23c3ed85'/%3E%3Cpath d='M6 24h7l4-13 5 20 4-12h8' fill='none' stroke='%23131b17' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="lessons.js"></script>
    <script defer src="room-view.js"></script>
    <script defer src="site-build.js"></script>
    <script defer src="site-scene.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <div class="topbar">
        <a class="brand" href="#home" aria-label="Signal Works home"
          ><span class="mark" aria-hidden="true">∿</span>Signal Works<span
            class="brand-dot"
            >.</span
          ></a
        >
        <nav aria-label="Primary">
          <a id="home-nav" href="#home">Overview</a
          ><a id="tracks-nav" href="#tracks">Learning tracks</a
          ><a href="labs.html">Sim labs <span aria-hidden="true">↗</span></a
          ><a href="fieldwork.html">Field projects</a>
        </nav>
        <span class="local-status"><i></i> Personal workspace</span>
      </div>
    </header>
    <template id="room-hero">
      <section class="hero workshop-hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <div class="eyebrow">Industrial Systems Academy</div>
          <h1 id="hero-title">Build the plant<br />from the ground up.</h1>
          <p>
            Survey an empty site, place the buildings, connect utilities and fit
            out the factory. Then take a potato batch all the way to dispatch.
          </p>
          <div class="actions">
            <a class="btn" href="fries.html?mode=build#site"
              >Start on vacant land →</a
            >
            <a href="fries.html?mode=worked#site">Inspect the worked site</a>
            <a href="fries.html?mode=solved#floor"
              >Operate the installed line</a
            >
          </div>
        </div>
        <div class="line-visual">
          <canvas
            id="fry-preview"
            role="img"
            aria-label="Worked site layout with six industrial buildings, utility routes and access roads. Drag to orbit."
          ></canvas>
        </div>
      </section>
      <section class="station-section" aria-labelledby="station-title">
        <div class="section-head">
          <div>
            <h2 id="station-title">Workshop stations</h2>
            <p>
              Individual controls and robot-cell exercises.
              <a href="production.html">Enter the production workshop →</a>
            </p>
          </div>
        </div>
        <nav class="stations" aria-label="Hands-on workstations">
          <a href="production.html#servers"
            ><strong>Servers &amp; network</strong
            ><span>Prepare the infrastructure</span></a
          >
          <a href="production.html#sequence"
            ><strong>PLC</strong><span>Sequence the machine</span></a
          >
          <a href="production.html#scada"
            ><strong>SCADA</strong><span>Inspect the process</span></a
          >
          <a href="production.html#robot"
            ><strong>Robot cell</strong><span>Set up the transfer</span></a
          >
          <a href="production.html#orders"
            ><strong>MES &amp; ERP</strong><span>Reconcile the order</span></a
          >
          <a href="equipment.html"
            ><strong>Equipment guide</strong
            ><span>Learn the hardware and software</span></a
          >
        </nav>
      </section>
      <section class="room-exhibit" aria-labelledby="exhibit-title">
        <div class="exhibit-copy">
          <div class="eyebrow">Infrastructure practical</div>
          <h2 id="exhibit-title">Inside the server room.</h2>
          <p>
            Place the rack, mount the hardware and trace its power and network
            connections.
          </p>
          <div class="actions">
            <a class="exhibit-link" href="room.html">Build a server room →</a
            ><a class="quiet" href="room-guide.html">Build guide</a>
          </div>
        </div>
        <div class="preview-panel">
          <div class="preview-stage">
            <canvas
              id="room-preview"
              tabindex="0"
              aria-label="Interactive server room preview. Press 1 for the room, 2 for the rack front or 3 for the rear."
            ></canvas>
          </div>
          <div class="preview-strip">
            <p id="preview-status" role="status">Loading the room preview…</p>
            <div
              class="preview-controls"
              role="group"
              aria-label="Preview camera"
            >
              <button type="button" data-preview-camera="room" disabled>
                Room
              </button>
              <button type="button" data-preview-camera="rack" disabled>
                Front
              </button>
              <button type="button" data-preview-camera="rear" disabled>
                Rear
              </button>
            </div>
          </div>
        </div>
      </section>
    </template>
    <main id="main" tabindex="-1"></main>
    <footer>
      <span>Signal Works<span class="brand-dot">.</span></span
      ><span>Industrial Systems Academy</span>
    </footer>
  </body>
</html>
